<section>

  <h2>Shopping Cart</h2>

  <p *ngIf="message" [class]="isError ? 'error-message' : 'message'">{{ message }}</p>

  <div *ngIf="cart && cart.items.length === 0">
    <p>Your cart is empty. Add some products first.</p>
  </div>

  <div *ngIf="cart && cart.items.length > 0">

    <div class="list">

      <div class="list-row" *ngFor="let item of cart.items">

        <div>
          <strong>{{ item.productName }}</strong>
          <p>{{ item.price }} x {{ item.quantity }}</p>
        </div>

        <div>
          <strong>{{ item.subtotal }}</strong>
        </div>

        <div class="row-actions">
          <button class="danger-button" (click)="removeItem(item.cartItemId)">Remove</button>
        </div>

      </div>

    </div>

    <div class="card" style="margin-top:20px; text-align:right;">
      <h3>Total: {{ cart.total }}</h3>
      <button class="primary-button" [disabled]="isPlacingOrder" (click)="placeOrder()">Place Order</button>
    </div>

  </div>

</section>
